<style>
  :root {
    --steel-black: #0b0f14;
    --steel-gray: #1c2733;
    --fog-white: #e8edf2;
    --ring-blue: #4da3ff;
    --lead-gray: #8a97a5;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace;
    --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--steel-black);
    color: var(--fog-white);
    font-family: var(--sans);
    overflow-x: hidden;
  }

  /* 滚动轨道：纯滚动距离占位（背景舞台已固定），页面实际高度 = 首页 + 轨道
     pointer-events none：不能遮挡底层 3D 工牌画布的拖拽交互 */
  #track { height: 560vh; position: relative; pointer-events: none; }

  /* 背景舞台：固定铺满视口（帧序列 + 3D 工牌 + 液态玻璃），始终在底层 */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--steel-black);
    z-index: 0;
  }
  #stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 滚动提示：纯图形鼠标图标 */
  .wheel-hint {
    position: absolute;
    left: 50%;
    bottom: 6vh;
    transform: translateX(-50%);
    z-index: 4;
    pointer-events: none;
  }
  .mouse {
    width: 22px;
    height: 36px;
    border: 1.5px solid var(--lead-gray);
    border-radius: 11px;
    position: relative;
  }
  .mouse::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 7px;
    width: 3px;
    height: 7px;
    margin-left: -1.5px;
    border-radius: 2px;
    background: var(--ring-blue);
    animation: wheelDrop 1.6s ease-in-out infinite;
  }
  @keyframes wheelDrop {
    0% { transform: translateY(0); opacity: 1; }
    70% { transform: translateY(10px); opacity: 0; }
    100% { transform: translateY(0); opacity: 0; }
  }

  /* 滚动进度线（纯图形） */
  #progress {
    position: absolute;
    right: 40px;
    bottom: 32px;
    z-index: 5;
    width: 140px;
    height: 2px;
    background: rgba(138, 151, 165, 0.25);
    pointer-events: none;
  }
  #progress i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--ring-blue);
  }

  /* 帧计数标签 */
  #frameLabel {
    position: absolute;
    right: 40px;
    bottom: 44px;
    z-index: 5;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--lead-gray);
    pointer-events: none;
  }

  /* 嵌入式 3D 工牌（React Bits Lanyard）
     画布覆盖整个舞台，工牌可拖到屏幕任意位置；
     第 20-24 帧落下入场，之后常驻屏幕，不再退场；
     z-index 8 位于最上层（高于两块液态玻璃）；
     画布保持 pointer-events:none，指针事件挂在 body 上，不遮挡下层玻璃交互 */
  #lanyard-root {
    position: absolute;
    inset: 0;
    z-index: 8;
    will-change: transform;
    transform: translateY(-110vh);
    visibility: hidden;
    pointer-events: none;
  }
  #lanyard-root .lanyard-wrapper { height: 100%; }
  #lanyard-root canvas { touch-action: pan-y; }

  /* 蓝紫色透明液态玻璃（16:9 长方形，图片玻璃 72vw ≈ 0.8 倍网页大小，视频玻璃 54vw）
     #liquidGlass：第 70-84 帧居中显示；#liquidGlass2：第 30-44 帧，与原本同尺寸同结构同 UI；
     #liquidGlass3：第 116-119 帧淡入并保持（末帧出现），内装"作品"文件夹视频播放器。
     overflow:clip：裁剪内部 Drift Wall 溢出部分并随 glassMorph 圆角同步形变，
     且完全禁止滚动（防止轮播聚焦时浏览器把玻璃内容滚偏） */
  #liquidGlass,
  #liquidGlass2,
  #liquidGlass3 {
    display: none;
    position: absolute;
    left: 50%;
    top: 50%;
    width: 72vw; /* 90vw × 0.8 等比缩小 */
    overflow: hidden;
    overflow: clip;
    aspect-ratio: 16 / 9;
    pointer-events: none;
    background:
      radial-gradient(120% 120% at 30% 22%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 42%),
      radial-gradient(100% 100% at 68% 82%, rgba(168, 85, 247, 0.28), rgba(99, 91, 255, 0.14) 55%, rgba(120, 190, 255, 0.18) 100%);
    backdrop-filter: blur(16px) saturate(150%) brightness(1.1);
    -webkit-backdrop-filter: blur(16px) saturate(150%) brightness(1.1);
    border: 1.5px solid rgba(255, 255, 255, 0.38);
    box-shadow:
      inset 0 0 46px rgba(255, 255, 255, 0.22),
      inset -18px -24px 60px rgba(150, 110, 255, 0.28),
      inset 14px 18px 46px rgba(120, 190, 255, 0.20),
      0 24px 90px rgba(90, 80, 255, 0.18);
    animation: glassMorph 9s ease-in-out infinite;
    will-change: transform;
  }
  /* 原玻璃（70-84 帧，最后展示图片的一块）：透明度比默认稍高（渐变底色 alpha 略降） */
  #liquidGlass {
    z-index: 4;
    background:
      radial-gradient(120% 120% at 30% 22%, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 42%),
      radial-gradient(100% 100% at 68% 82%, rgba(168, 85, 247, 0.20), rgba(99, 91, 255, 0.10) 55%, rgba(120, 190, 255, 0.13) 100%);
  }
  /* 第二块玻璃（30-44 帧，展示单拎出来的 13 件精选）：
     z-index 7 高于原玻璃；工牌（z 8）在其最上层，可隔着玻璃拖拽 */
  #liquidGlass2 { z-index: 7; }
  /* 第三块玻璃（116-119 帧，装"作品"视频）：z-index 9 置于顶层（高于工牌 z 8），防止工牌遮挡视频；
     90vw × 0.6 = 54vw 等比缩小，并上移到背景手掌上方（掌心上方悬浮） */
  #liquidGlass3 { z-index: 9; width: 54vw; top: 40%; }

  #liquidGlass::after,
  #liquidGlass2::after,
  #liquidGlass3::after {
    content: "";
    position: absolute;
    left: 6%;
    top: 10%;
    width: 26%;
    height: 34%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
    border-radius: 50%;
    filter: blur(3px);
    transform: rotate(-16deg);
  }
  @keyframes glassMorph {
    0%, 100% { border-radius: 4.5% 3.5% 4% 5% / 6% 4.5% 5.5% 4%; }
    33% { border-radius: 3.5% 5% 4.5% 4% / 4.5% 5.5% 4% 6%; }
    66% { border-radius: 5% 4% 3.5% 4.5% / 5.5% 4% 6% 4.5%; }
  }

  /* ---- 第三块玻璃内部：视频播放器（"作品"文件夹 校园部门招新.mp4） ---- */
  #liquidGlass3 .video-shell {
    position: absolute;
    inset: 0;
    background: rgba(4, 8, 16, 0.45);
  }
  #liquidGlass3 video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: pointer;
  }
  /* 中央播放按钮（暂停时显示，玻璃质感） */
  #liquidGlass3 .video-bigplay {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.45);
    background:
      radial-gradient(120% 120% at 30% 22%, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 50%),
      linear-gradient(135deg, rgba(168, 85, 247, 0.22), rgba(99, 91, 255, 0.20) 55%, rgba(120, 190, 255, 0.22));
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    color: #fff;
    font-size: 28px;
    display: grid;
    place-items: center;
    padding-left: 6px; /* 播放三角形视觉居中 */
    cursor: pointer;
    box-shadow:
      inset 0 0 24px rgba(255, 255, 255, 0.25),
      0 12px 44px rgba(90, 80, 255, 0.35);
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  #liquidGlass3 .video-bigplay:hover { transform: translate(-50%, -50%) scale(1.08); }
  #liquidGlass3.playing .video-bigplay { opacity: 0; pointer-events: none; }
  /* 底部控制条：进度 + 全屏（播放中鼠标静止 2.4s 后隐藏） */
  #liquidGlass3 .video-bar {
    position: absolute;
    left: 4%;
    right: 4%;
    bottom: 5%;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: opacity 0.3s ease;
  }
  #liquidGlass3.playing.controls-hidden .video-bar { opacity: 0; pointer-events: none; }
  #liquidGlass3 .video-progress {
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.28);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  #liquidGlass3 .video-progress i {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--ring-blue), #a855f7);
  }
  #liquidGlass3 .video-fs {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    background:
      radial-gradient(120% 120% at 30% 22%, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 55%),
      linear-gradient(135deg, rgba(168, 85, 247, 0.18), rgba(120, 190, 255, 0.18));
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    color: #fff;
    font-size: 15px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  #liquidGlass3 .video-fs:hover { transform: scale(1.1); }
  /* 全屏播放：外壳铺满屏幕，去圆角与玻璃底色，纯黑影院背景 */
  #liquidGlass3 .video-shell:fullscreen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 0;
    background: #000;
  }
  #liquidGlass3 .video-shell:fullscreen .video-bar { bottom: 4%; }

  /* 加载条（纯图形） */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--steel-black);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .bar {
    width: 220px;
    height: 2px;
    background: var(--steel-gray);
    overflow: hidden;
  }
  #loader .bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--ring-blue);
    transition: width 0.2s ease;
  }

  @media (max-width: 640px) {
    #progress { right: 20px; bottom: 26px; width: 90px; }
    #frameLabel { right: 20px; bottom: 38px; font-size: 9px; }
  }
</style>
</head>

<!-- 3D 工牌落位参数（须在 lanyard-embed/embed.js 之前设置）：
     工牌卡片左缘贴近页面左侧 15px，垂直位置不变。
     世界坐标换算：fov 默认 20、相机 z=18，z=0 平面半高 = 18·tan(10°)；
     卡片世界宽 1.8（0.8 物理盒 × 2.25 缩放），按屏幕像素算出中心落点，
     指针射线与视觉天然一致，拖拽不受影响 -->
<script>
(function () {
  var HALF_H = 18 * Math.tan(10 * Math.PI / 180);
  var HALF_W = HALF_H * innerWidth / innerHeight;
  var CARD_HALF_W = 0.9;  // 卡片世界半宽
  var LEFT_GAP = 15;      // 卡片左缘距页面左边缘 15px
  var cardHalfPx = CARD_HALF_W / (2 * HALF_H) * innerHeight;
  var cx = LEFT_GAP + cardHalfPx;
  window.LANYARD_EMBED_CONFIG = {
    anchor: [(cx / innerWidth * 2 - 1) * HALF_W, 4, 0]
  };
})();
</script>

<script>
(function () {
  const TOTAL = 119;
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const stage = document.getElementById("stage");
  const track = document.getElementById("track");
  const progressFill = document.getElementById("progressFill");
  const frameLabel = document.getElementById("frameLabel");
  const lanyardRoot = document.getElementById("lanyard-root");
  const glassEl = document.getElementById("liquidGlass");
  const glass2El = document.getElementById("liquidGlass2");
  const glass3El = document.getElementById("liquidGlass3");
  const workVideo = document.getElementById("workVideo");
  const videoShell = document.getElementById("videoShell");
  const videoBigPlay = document.getElementById("videoBigPlay");
  const videoFs = document.getElementById("videoFs");
  const videoProgress = document.getElementById("videoProgress");

  const frames = new Array(TOTAL + 1);
  let loaded = 0;

  // 预加载全部帧
  for (let i = 1; i <= TOTAL; i++) {
    const img = new Image();
    img.onload = () => {
      loaded++;
      document.getElementById("loadBar").style.width =
        Math.round((loaded / TOTAL) * 100) + "%";
      if (loaded === TOTAL) {
        document.getElementById("loader").classList.add("done");
      }
    };
    img.src = "frames-bg/" + String(i).padStart(3, "0") + ".webp";
    frames[i] = img;
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = stage.clientWidth * dpr;
    cv.height = stage.clientHeight * dpr;
    draw(current);
  }

  // cover 模式绘制，保证任意窗口比例下不变形、不留边
  function draw(n) {
    const img = frames[n];
    if (!img || !img.complete || !img.naturalWidth) return;
    const cw = cv.width, ch = cv.height;
    const scale = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
    const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  // 平滑插值：滚轮滚动时画面像播放一样顺滑
  let current = 1;
  const lerp = (a, b, t) => a + (b - a) * t;

  function progress() {
    /* 背景播放不受首页约束：从页面顶部即开始跟随滚动 */
    const max = track.offsetHeight - window.innerHeight;
    return max > 0 ? Math.min(Math.max(window.scrollY / max, 0), 1) : 0;
  }

  let lastFrame = -1;

  // ---- 帧驱动的工牌入场（滚动可逆擦洗） ----
  // 第 20-23 帧落下（带一点弹性过冲），第 24 帧起常驻悬挂，不再退场
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

  function updateBadge(f) {
    if (f < 20) {
      lanyardRoot.style.visibility = "hidden";
      lanyardRoot.style.transform = "translateY(-110vh)";
      return;
    }
    lanyardRoot.style.visibility = "visible";
    const y = f < 24
      ? -110 * (1 - easeOutBack((f - 20) / 4))          // 落下
      : 0;                                              // 常驻悬挂
    lanyardRoot.style.transform = "translateY(" + y.toFixed(2) + "vh)";
  }

  // ---- 蓝紫色液态玻璃：出现 → 保持 → 消失（每块 14 帧窗口，滚动可逆擦洗） ----
  // #liquidGlass 第 70 帧出现、#liquidGlass2 第 30 帧出现，包络一致：
  // 0-3 帧淡入放大，3-11 帧保持，11-14 帧淡出缩小，窗口外隐藏。
  // sticky = true 时不淡出（#liquidGlass3 末帧玻璃：淡入后一直保持到滚动结束，
  // 回滚时同一条包络倒放自然淡出）。可见期间开启 pointer-events：
  // 玻璃内 GlowCursor 光迹 / 轮播 / 点击放大 / 视频播放需要接收鼠标
  function updateGlass(el, start, f, sticky) {
    const local = f - start;
    if (local < 0 || (!sticky && local >= 14)) {
      if (el.style.display !== "none") {
        el.style.display = "none";
        el.style.pointerEvents = "none";
      }
      return;
    }
    let o, s;
    if (local < 3) {
      const t = local / 3;
      o = t;
      s = 0.6 + 0.4 * easeOutCubic(t);
    } else if (sticky || local < 11) {
      o = 1; s = 1;
    } else {
      const t = (local - 11) / 3;
      o = 1 - t;
      s = 1 - 0.3 * t * t;
    }
    el.style.display = "block";
    el.style.pointerEvents = "auto";
    el.style.opacity = o.toFixed(3);
    // 倾斜/悬停变量由 React Bits TiltedCard 交互（glass-embed GlassTilt）写入
    el.style.transform =
      "translate(-50%,-50%) perspective(1200px) rotateX(var(--glass-rx,0deg)) rotateY(var(--glass-ry,0deg)) " +
      "scale(calc(" + s.toFixed(3) + " * var(--glass-hover,1)))";
  }

  // ---- 第三块玻璃内的视频播放器（点击播放/暂停，可全屏） ----
  let hideTimer = null;

  // 播放中鼠标静止 2.4s 隐藏控制条；暂停/结束时立即显示
  function scheduleBarHide() {
    clearTimeout(hideTimer);
    glass3El.classList.remove("controls-hidden");
    if (!workVideo.paused) {
      hideTimer = setTimeout(() => glass3El.classList.add("controls-hidden"), 2400);
    }
  }
  // 同步播放状态 UI：.playing 类隐藏中央播放按钮（暂停/播完时恢复显示）
  function syncVideoUI() {
    glass3El.classList.toggle("playing", !workVideo.paused && !workVideo.ended);
    scheduleBarHide();
  }
  function togglePlay() {
    if (workVideo.paused) workVideo.play();
    else workVideo.pause();
  }

  workVideo.addEventListener("click", togglePlay);
  // 中央播放按钮：仅开始播放（不自动全屏，避免全屏请求失败导致播放中断）
  videoBigPlay.addEventListener("click", () => {
    if (workVideo.paused) workVideo.play();
  });
  workVideo.addEventListener("play", syncVideoUI);
  workVideo.addEventListener("pause", syncVideoUI);
  workVideo.addEventListener("ended", syncVideoUI);
  workVideo.addEventListener("timeupdate", () => {
    if (workVideo.duration) {
      videoProgress.querySelector("i").style.width =
        (workVideo.currentTime / workVideo.duration * 100).toFixed(2) + "%";
    }
  });
  // 进度条点击跳转
  videoProgress.addEventListener("click", (e) => {
    if (!workVideo.duration) return;
    const r = videoProgress.getBoundingClientRect();
    const ratio = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
    workVideo.currentTime = ratio * workVideo.duration;
  });
  // 播放中移动鼠标重新呼出控制条
  videoShell.addEventListener("mousemove", scheduleBarHide);

  // 全屏播放（对视频外壳全屏，保留自定义控制条；请求失败时降级为仅播放）
  videoFs.addEventListener("click", () => {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else if (videoShell.requestFullscreen) {
      videoShell.requestFullscreen().catch(() => {});
    } else if (workVideo.webkitEnterFullscreen) {
      workVideo.webkitEnterFullscreen();
    }
  });
  document.addEventListener("fullscreenchange", () => {
    const fs = !!document.fullscreenElement;
    videoFs.querySelector("i").className = fs ? "fa-solid fa-compress" : "fa-solid fa-expand";
  });

  function tick() {
    const p = progress();
    const target = 1 + p * (TOTAL - 1);
    current = lerp(current, target, 0.18);
    if (Math.abs(current - target) < 0.01) current = target;
    draw(Math.round(current));
    progressFill.style.width = (p * 100).toFixed(1) + "%";
    updateBadge(current);
    updateGlass(glassEl, 70, current);
    updateGlass(glass2El, 30, current);
    updateGlass(glass3El, 116, current, true);
    // 玻璃随滚动隐藏时暂停视频并退出全屏
    if (glass3El.style.display === "none" && (!workVideo.paused || document.fullscreenElement)) {
      workVideo.pause();
      if (document.fullscreenElement) document.exitFullscreen();
    }
    const f = Math.round(current);
    if (f !== lastFrame) {
      lastFrame = f;
      frameLabel.textContent = "FRAME " + String(f).padStart(3, "0") + " / " + TOTAL;
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener("resize", resize);
  resize();
    requestAnimationFrame(tick);
  })();

  /* 首页交互脚本（UI-09 / UI-10 / UI-11） */
</script>

</body>
