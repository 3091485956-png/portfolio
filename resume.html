<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的简历 · Truth Comes from Within</title>
<!-- 「我的简历」页：React Bits 官方 Aurora 背景 + Electric Border 液态玻璃简历
     + 首页同款 3D 工牌（lanyard-embed 原样复用，落在"找牛人"表情正中）
     + Lanyard 挂绳简历卡（lanyard-resume-embed：正面=HR简历.pdf 渲染图，背面=纯白，
       纯贴图无材质光影，落下盖住页面正中的 About ME 简历）
     + 拍立得悬浮卡片（Profile Card 指针追踪描边光/聚光灯/底部辉光）+ BorderGlow 返回按钮
     体验由 React Bits 官方组件构建产物驱动（图片已内联），双击即可打开 -->
<link rel="stylesheet" href="lanyard-embed/style.css">
<link rel="stylesheet" href="lanyard-resume-embed/style.css">
<link rel="stylesheet" href="resume-embed/style.css">
<style>
  html, body { margin: 0; padding: 0; background: #05060e; }
  #resume-root { position: fixed; inset: 0; }

  /* ---- 首页同款 3D 工牌（lanyard-embed 原样嵌入）----
     摆动动画完全来自 React Bits 官方 Lanyard 的绳索物理；
     入场只做「从上方落下」：初始整体停在视口上方，物理初始化后释放，
     自然坠到位，随后的摆动由官方物理接管。
     落位校准走世界坐标（fov + 吊点 anchor，见下方内联脚本），
     不能用 CSS transform——R3F 指针射线按画布布局尺寸换算，
     CSS transform 会让拖拽热区与视觉错位 */
  #lanyard-drop {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    transform: translateY(-112vh);
    will-change: transform;
  }
  #lanyard-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #lanyard-root canvas { touch-action: pan-y; }
  #lanyard-drop.is-released {
    transform: translateY(0);
    transition: transform 0.9s cubic-bezier(0.55, 0, 1, 0.55); /* 加速下坠 */
  }

  /* ---- Lanyard 挂绳简历卡（第二个实例：lanyard-resume-embed）----
     与工牌同款落下入场，略晚释放形成先后落下的节奏 */
  #resume-lanyard-drop {
    position: fixed;
    inset: 0;
    z-index: 7;
    pointer-events: none;
    transform: translateY(-112vh);
    will-change: transform;
  }
  #lanyard-resume-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #lanyard-resume-root canvas { touch-action: pan-y; }
  #resume-lanyard-drop.is-released {
    transform: translateY(0);
    transition: transform 0.9s cubic-bezier(0.55, 0, 1, 0.55);
  }
  @media (prefers-reduced-motion: reduce) {
    #lanyard-drop, #resume-lanyard-drop { transform: none; transition: none; }
  }

  /* ---- 拍立得 Profile Card 效果（React Bits ProfileCard 移植）----
     指针追踪三件套：① 卡后彩色辉光 ② 卡面聚光灯 ③ 边缘描边光，
     位置由 --pc-x/--pc-y 驱动、显隐由 --pc-on 驱动（见页尾脚本）；
     全部走伪元素，不改动 React 管理的 DOM */
  .tilt-card { --pc-x: 50%; --pc-y: 42%; --pc-on: 0; }
  /* ① 卡后辉光：蓝紫光晕垫在卡片后，跟随指针 */
  .tilt-card::before {
    content: "";
    position: absolute;
    inset: -9%;
    border-radius: 26px;
    background: radial-gradient(
      62% 52% at var(--pc-x) var(--pc-y),
      rgba(77, 163, 255, 0.65),
      rgba(168, 85, 247, 0.3) 55%,
      rgba(99, 91, 255, 0) 78%
    );
    filter: blur(20px);
    transform: translateZ(-30px);
    opacity: var(--pc-on);
    transition: opacity 0.35s ease;
    pointer-events: none;
  }
  /* ② 卡面聚光灯：淡蓝光斑浮在图片上方（hover 弹出的 3D 形象在 Z32，光斑在其上） */
  .tilt-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      75% 60% at var(--pc-x) var(--pc-y),
      rgba(140, 190, 255, 0.3),
      rgba(168, 85, 247, 0.12) 55%,
      rgba(99, 91, 255, 0) 75%
    );
    transform: translateZ(33px);
    opacity: var(--pc-on);
    transition: opacity 0.35s ease;
    pointer-events: none;
  }
  /* ③ 描边光：贴边一圈随指针变色的渐变亮边（padding-box 排空 → 只剩边框环） */
  .tilt-card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    padding: 1.6px;
    background: radial-gradient(
      240px circle at var(--pc-x) var(--pc-y),
      rgba(160, 210, 255, 1),
      rgba(77, 163, 255, 0.85) 40%,
      rgba(168, 85, 247, 0.5) 62%,
      rgba(99, 91, 255, 0) 80%
    );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    transform: translateZ(34px);
    opacity: var(--pc-on);
    transition: opacity 0.35s ease;
    pointer-events: none;
  }
</style>
</head>

<!-- 3D 工牌落位参数（须在 lanyard-embed/embed.js 之前设置）：
     把卡片吊挂到"找牛人"表情包正中，可见大小 = 表情包 × 0.7 × 1.2（放大 1.2 倍，落点不变）。
     表情包在简历图（≈16:9）中的几何（实测）：中心 (0.19, 0.534)，高 0.739；
     卡片静止世界尺寸与悬挂偏移由首页实机测得。
     世界坐标校准：调 fov 控制大小、调吊点 anchor 控制落点，
     指针射线与视觉天然一致，工牌可正常拖拽。 -->
<script>
(function () {
  var W = innerWidth, H = innerHeight;
  var EMOJI_CX = 0.19, EMOJI_CY = 0.534, SIZE = 0.7 * 1.2 * 0.739; // 表情包几何 × 0.7，再放大 1.2 倍（落点不变）
  var CARD_WORLD_H = 2.371;   // 工牌静止可见高度（世界单位，实机校准）
  var REST_DX = 0;            // 静止时卡片中心在吊点正下方（实测无侧倾）
  var REST_DY = 3.99;         // 悬挂长度：3×0.83 绳段 + 1.5 关节偏移
  var CAM_Z = 18;

  // .glass-electric: min(86vw, 152vh) − 2×13px padding，内玻璃 16:9 居中
  var glassW = Math.min(W * 0.86, H * 1.52) - 26;
  var glassH = glassW * 9 / 16;
  var cx = (W - glassW) / 2 + EMOJI_CX * glassW;
  var cy = (H - glassH) / 2 + EMOJI_CY * glassH;

  var V = CARD_WORLD_H / (SIZE * glassH / H);          // 需要的 z=0 平面可视高度
  var fov = 2 * Math.atan(V / (2 * CAM_Z)) * 180 / Math.PI;
  var halfH = V / 2, halfW = halfH * W / H;
  var tx = (cx / W * 2 - 1) * halfW;
  var ty = -((cy / H * 2 - 1) * halfH);
  window.LANYARD_EMBED_CONFIG = { fov: fov, anchor: [tx + REST_DX, ty + REST_DY, 0] };
})();
</script>

<!-- 挂绳简历卡落位参数（须在 lanyard-resume-embed/embed.js 之前设置）：
     落点：卡片中心对准液态玻璃（About ME 简历）的水平中心，NUDGE_X 可做像素微调；
     大小：卡片可见高度 ≈ 简历图高度（0.958 × 玻璃高），落下后刚好盖住中间的简历。
     世界坐标换算：调 fov 控制大小、调吊点 anchor 控制落点，
     指针射线与视觉天然一致，卡片可正常拖拽/甩动翻面。 -->
<script>
(function () {
  var W = innerWidth, H = innerHeight;
  var NUDGE_X = 36;           // 水平微调（像素，正=右）：对齐 About ME 简历视觉中心
  var RES_H_FRAC = 0.958;     // 简历图占玻璃高度（resume-img 上下各留 2.1%）
  var CARD_WORLD_H = 2.371;   // 卡片静止可见高度（世界单位，实机校准）
  var REST_DY = 4.045;        // 悬挂长度：3×0.83 绳段 + 1.5 关节偏移（+0.055 补偿关节自然下沉）
  var CAM_Z = 18;

  var glassW = Math.min(W * 0.86, H * 1.52) - 26;
  var glassH = glassW * 9 / 16;
  var cx = W / 2 + NUDGE_X, cy = H / 2;
  var targetH = glassH * RES_H_FRAC; // 卡片目标可见像素高度 ≈ 简历图高度

  var V = CARD_WORLD_H * H / targetH;                  // 需要的 z=0 平面可视高度
  var fov = 2 * Math.atan(V / (2 * CAM_Z)) * 180 / Math.PI;
  var halfH = V / 2, halfW = halfH * W / H;
  var tx = (cx / W * 2 - 1) * halfW;
  var ty = -((cy / H * 2 - 1) * halfH);
  window.LANYARD_RESUME_EMBED_CONFIG = {
    fov: fov,
    anchor: [tx, ty + REST_DY, 0],
    imageFit: "cover",
    frontImage: window.LANYARD_CARD_FRONT,
    backImage: window.LANYARD_CARD_BACK
  };
})();

/* 简历卡落下入场：比工牌（resume-embed 内 250ms 释放）晚一拍 */
window.addEventListener("load", function () {
  var el = document.getElementById("resume-lanyard-drop");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.style.transform = "none";
    return;
  }
  setTimeout(function () { el.classList.add("is-released"); }, 420);
});
</script>

<script src="lanyard-embed/embed.js"></script>

<!-- 拍立得 Profile Card：指针追踪（事件委托，React 重渲染不影响；
     只写 CSS 变量 --pc-x/--pc-y/--pc-on，配合页头伪元素样式） -->
<script>
(function () {
  "use strict";
  var active = null;
  function track(e) {
    var t = e.target && e.target.closest ? e.target.closest(".tilt-card") : null;
    if (active && active !== t) {
      active.style.setProperty("--pc-on", "0");
      active = null;
    }
    if (!t) return;
    active = t;
    var r = t.getBoundingClientRect();
    if (!r.width || !r.height) return;
    t.style.setProperty("--pc-x", ((e.clientX - r.left) / r.width * 100).toFixed(2) + "%");
    t.style.setProperty("--pc-y", ((e.clientY - r.top) / r.height * 100).toFixed(2) + "%");
    t.style.setProperty("--pc-on", "1");
  }
  document.addEventListener("pointermove", track, { passive: true });
  document.addEventListener("pointerdown", track, { passive: true });
  document.addEventListener("pointerleave", function () {
    if (active) active.style.setProperty("--pc-on", "0");
    active = null;
  }, { passive: true });
  window.addEventListener("blur", function () {
    if (active) active.style.setProperty("--pc-on", "0");
    active = null;
  });
})();
</script>
